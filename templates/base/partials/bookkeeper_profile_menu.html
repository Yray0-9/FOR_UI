<div class="dropdown dashboard-user-dropdown">
    <button type="button" class="btn dashboard-profile-btn" id="dashboardProfileMenuButton" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open user menu">
        <span class="dashboard-avatar" id="dashboardUserAvatar">{{ current_user_initials|default:"SB" }}</span>
        <span class="dashboard-user-meta">
            <strong id="dashboardUserName">{{ current_user_name|default:"Bookkeeper User" }}</strong>
            <small>{{ current_user_role_label|default:"Bookkeeper" }}</small>
        </span>
        <i class="bi bi-chevron-down"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end dashboard-profile-menu" aria-labelledby="dashboardProfileMenuButton">
        <li>
            <a href="{% url 'profile' %}" class="dropdown-item">
                <i class="bi bi-person"></i>
                <span>Profile</span>
            </a>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
            <a href="{% url 'login' %}" class="dropdown-item text-danger" data-bookkeeper-logout>
                <i class="bi bi-box-arrow-right"></i>
                <span>Log out</span>
            </a>
        </li>
    </ul>
</div>
